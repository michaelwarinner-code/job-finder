name: Poll job boards

on:
  schedule:
    # Every 10 minutes. GitHub's practical floor is ~5 min but exact timing
    # isn't guaranteed under load -- 10 is a reliable, still-fast interval.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      company:
        description: "Company key to resync immediately (leave blank for a normal run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run poller
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_COMPANY: ${{ github.event.inputs.company }}
        run: python poller/run.py

      - name: Commit updated state
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add state/state.json
          git diff --quiet --cached || git commit -m "Update state [skip ci]"

          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) -- pulling latest and retrying..."
            git pull --rebase origin main
          done
